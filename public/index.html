<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Game of Life</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="head">
            <h1 class="title">Game of Life</h1>
            <p class="subtitle">John Conway's Game of Life</p>
            <div class="divider"></div>
        </div>
        <div class="server-status">
            <img src="assets/cloud-find.png" id="server-image">
            <p id="server-message">Checking...</p>
        </div>

        <div class="options">
            <button id="start-btn">Start</button>
            <button id="next-btn">Next</button>
            <button id="load-btn">Load</button>
            <button id="save-btn">Save</button>
            <button id="authBtn">Login / Signup</button>
        </div>

        <div id="authModal" class="modal">
            <div class="auth-box">

                <button id="closeBtn" class="close-btn">&times;</button>

                <div id="loginFormContainer">
                    <h2>Login</h2>

                    <form id="loginForm">
                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            required
                        >

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        >

                        <button type="submit" id="loginBtn">
                            Login
                        </button>

                    </form>

                    <p>
                        Don't have an account?
                        <button type="button" id="showSignup">
                            Sign Up
                        </button>
                    </p>

                </div>

                <div id="signupFormContainer">
                    <h2>Create Account</h2>

                    <form id="signupForm">
                        <input
                            type="text"
                            name="username"
                            placeholder="Userame"
                            required
                        >

                        <br/>

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        >

                        <input
                            type="password"
                            name="cpassword"
                            placeholder="Confirm Password"
                            required
                        >

                        <button type="submit" id="signBtn">
                            Create Account
                        </button>
                    </form>

                    <p>
                        Already have an account?
                        <button type="button" id="showLogin">
                            Login
                        </button>
                    </p>
                </div>
                <p id="auth-status"></p>
            </div>
        </div>

        <div class="container">
            <div class="access">
                <p>Population: <span id="population-number">0</span></p>
                <button id="reset-btn">&#8634;</button>
            </div>
            <div id="main-board"></div>
        </div>

        <script type="module" src="./script/main.js"></script>
        <script type="module" src="./script/utils/Buttons.js"></script>
    </body>
</html>
