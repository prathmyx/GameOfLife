<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Game of Life</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="head">
            <h1 class="title">Game of Life</h1>
            <p class="subtitle">John Conway's Game of Life</p>
            <div class="divider"></div>
        </div>
        <div class="server-status">
            <img src="assets/cloud-find.png" id="server-image">
            <p id="server-message">Checking...</p>
        </div>

        <div class="options">
            <button id="start-btn">Start</button>
            <button id="next-btn">Next</button>
            <button id="load-btn">Load</button>
            <button id="save-btn">Save</button>
            <button id="authBtn">Login / Signup</button>
        </div>

        <div id="authModal" class="modal">
            <div class="modal-box">

                <button id="closeBtn" class="close-btn">&times;</button>

                <div id="loginFormContainer">
                    <h2>Login</h2>

                    <form id="loginForm">
                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            required
                        >

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        >

                        <button type="submit" id="loginBtn">
                            Login
                        </button>

                    </form>

                    <p>
                        Don't have an account?
                        <button type="button" id="showSignup">
                            Sign Up
                        </button>
                    </p>

                </div>

                <div id="signupFormContainer">
                    <h2>Create Account</h2>

                    <form id="signupForm">
                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            required
                        >

                        <br/>

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        >

                        <input
                            type="password"
                            name="cpassword"
                            placeholder="Confirm Password"
                            required
                        >

                        <button type="submit" id="signBtn">
                            Create Account
                        </button>
                    </form>

                    <p>
                        Already have an account?
                        <button type="button" id="showLogin">
                            Login
                        </button>
                    </p>
                </div>
                <p id="auth-status"></p>
            </div>
        </div>

        <div id="loadModal" class="modal">
            <div class="modal-box">
                <button id="closeBtnLoad" class="close-btn">&times;</button>

                <h2>Load Game</h2>

                <div class="load-options load-view" id="loadOptionsView">
                    <div id="globalLoad" class="load-option">
                        <button type="button" id="showGlobal">
                            From Global
                        </button>
                    </div>

                    <div id="personalLoad" class="load-option">
                        <button type="button" id="showPersonal">
                            My Saves
                        </button>
                    </div>
                </div>

                <div id="globalView" class="load-view"> 
                    <button type="button" class="back-btn" id="backFromGlobal"> ← </button>

                    <h2>Global Saves</h2>
                    <div id="globalSaves">

                    </div>
                </div> 
                
                <div id="personalView" class="load-view"> 
                    <button type="button" class="back-btn" id="backFromPersonal"> ← </button>

                    <h2>My Saves</h2>
                    <div id="personalSaves">

                    </div>
                </div>

                <p id="load-status"></p>
            </div>
        </div>

        <div id="saveModal" class="modal">
            <div class="modal-box">

                <button id="closeSaveBtn" class="close-btn">&times;</button>

                <div id="saveFormContainer">
                    <h2>Save</h2>

                    <form id="saveForm">
                        <input
                            type="text"
                            name="title"
                            placeholder="Untitled Game"
                            required
                        >

                        <button type="submit" id="saveBtn">
                            Save
                        </button>

                    </form>
                </div>
                <p id="save-status"></p>
            </div>
        </div>

        <div class="container">
            <div class="access">
                <p>Population: <span id="population-number">0</span></p>
                <button id="reset-btn">&#8634;</button>
            </div>
            <div id="main-board"></div>
        </div>

        <script type="module" src="./script/main.js"></script>
        <script type="module" src="./script/utils/Buttons.js"></script>
    </body>
</html>
