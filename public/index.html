<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Game of Life</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="head">
            <h1 class="title">Game of Life</h1>
            <p class="subtitle">John Conway's Game of Life</p>
            <div class="divider"></div>
        </div>
        <div class="server-status">
            <img src="assets/cloud-find.png" id="server-image">
            <p id="server-message">Checking...</p>
        </div>
        <div class="options">
            <button id="start-btn">Start</button>
            <button id="next-btn">Next</button>
            <button id="load-btn">Load</button>
            <button id="Save">Save</button>
        </div>

        <div class="container">
            <div class="access">
                <p>Population: <span id="population-number">0</span></p>
                <button id="reset-btn">⭯</button>
            </div>
            <div id="main-board"></div>
        </div>

        <script type="module" src="./script/main.js"></script>
        <script type="module" src="./script/utils/Buttons.js"></script>
    </body>
</html>
